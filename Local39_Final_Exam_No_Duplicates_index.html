function renderStart(){app.innerHTML=`<div class="card"><h1>Local 39 Final Exam</h1><p class="center muted">125 organized questions. This version has no duplicate question text.</p><div class="grid grid2" style="margin:18px 0"><button class="option ${S.mode==="practice"?"active":""}" onclick="S.mode='practice';render()"><b>Practice Mode</b><br><span class="muted">Shows explanations after each answer.</span></button><button class="option ${S.mode==="test"?"active":""}" onclick="S.mode='test';render()"><b>Test Mode</b><br><span class="muted">No explanations until the end.</span></button></div><div class="note"><b>Layout:</b><br>1-32: Bucket 1 Math<br>33-63: Bucket 2 Measurement / Geometry<br>64-94: Bucket 3 Mechanical Aptitude<br>95-125: Bucket 4 English<br><br>End result includes letter grade, percentage, score by bucket, missed questions, explanations, and focus list.</div><button class="primary" style="width:100%" onclick="start()">Start Final Exam</button></div>`}
function renderQuestion(){const q=QUESTIONS[S.current],show=S.mode==="practice"&&S.selected[S.current]!==undefined,answered=Object.keys(S.selected).length;app.innerHTML=`<div class="card"><div class="topbar"><div><div class="muted">${section(S.current)} • ${q.type}</div><h2>Question ${S.current+1} of ${QUESTIONS.length}</h2></div><div class="grid timerrow"><div class="pill">Total<br><b>${fmt(total())}</b></div><div class="pill">This Q<br><b>${fmt(cur())}</b></div><button class="${S.paused?"green":"primary"}" onclick="pause()">${S.paused?"Play":"Pause"}</button></div></div>${S.paused?'<div class="explain"><b>Paused.</b> Timers are stopped.</div>':''}<div class="progress"><div class="bar" style="width:${(S.current+1)/QUESTIONS.length*100}%"></div></div><div class="muted">Answered: ${answered}/${QUESTIONS.length}</div>${q.passage?`<div class="passage"><b>Passage:</b> ${q.passage}</div>`:""}<div class="q">${q.question}</div>${q.choices.map((c,i)=>{let cls="choice";const sel=S.selected[S.current]===i,cor=i===q.answer;if(show&&cor)cls+=" good";else if(show&&sel&&!cor)cls+=" bad";else if(sel)cls+=" sel";return `<button class="${cls}" onclick="choose(${i})" ${S.paused?"disabled":""}><b>${LETTERS[i]}.</b><span>${c}</span></button>`}).join("")}${show?`<div class="explain"><b>Explanation</b><br>${q.explanation}<br><br><b>Focus:</b> ${q.focus}</div>`:""}<div class="nav"><button class="light" onclick="go(${S.current-1})" ${S.current===0||S.paused?"disabled":""}>Previous</button>${S.current<QUESTIONS.length-1?`<button class="primary" onclick="go(${S.current+1})" ${S.paused?"disabled":""}>Next</button>`:`<button class="green" onclick="submit()" ${S.paused?"disabled":""}>Submit Exam</button>`}</div></div>`}
function renderResults(){const tt=total(),score=QUESTIONS.reduce((s,q,i)=>s+(S.selected[i]===q.answer?1:0),0),pct=Math.round(score/QUESTIONS.length*100),missed=QUESTIONS.map((q,i)=>Object.assign({},q,{idx:i,sel:S.selected[i],tm:S.times[i]||0})).filter(q=>q.sel!==q.answer),buckets={};QUESTIONS.forEach((q,i)=>{if(!buckets[q.bucket])buckets[q.bucket]={t:0,c:0};buckets[q.bucket].t++;if(S.selected[i]===q.answer)buckets[q.bucket].c++});const focus={};missed.forEach(q=>focus[q.focus]=(focus[q.focus]||0)+1);const focusList=Object.entries(focus).sort((a,b)=>b[1]-a[1]).slice(0,8);app.innerHTML=`<div class="card"><h1>Final Exam Complete</h1><p class="center" style="font-size:28px">Grade: <b>${grade(pct)}</b></p><p class="center" style="font-size:22px">Score: <b>${score}/${QUESTIONS.length}</b> (${pct}%)</p><div class="grid grid3"><div class="pill">Total time<br><b>${fmt(tt)}</b></div><div class="pill">Average / question<br><b>${fmt(tt/QUESTIONS.length)}</b></div><div class="pill">Missed / blank<br><b>${missed.length}</b></div></div><h2>Score by bucket</h2><div class="grid grid2">${Object.entries(buckets).map(([b,s])=>`<div class="pill"><b>${b}</b><br>${s.c}/${s.t} correct (${Math.round(s.c/s.t*100)}%)</div>`).join("")}</div><h2>What to focus on next</h2><div class="note">${focusList.length?focusList.map(([f,c])=>`<div><b>${c} missed:</b> ${f}</div>`).join(""):"No missed questions. Keep practicing speed."}</div><h2>Actual questions missed</h2>${missed.length?missed.map(m=>`<div class="result miss"><div class="muted">Question ${m.idx+1} • ${m.bucket} • ${m.type} • Time: ${fmt(m.tm)}</div><b>${m.question}</b><br><br>Your answer: <b>${ans(m.sel)}</b> ${m.sel!==undefined?`(${m.choices[m.sel]})`:""}<br>Correct answer: <b>${ans(m.answer)}</b> (${m.choices[m.answer]})<br><br><b>Explanation:</b> ${m.explanation}<br><span style="color:#1d4ed8"><b>Focus:</b> ${m.focus}</span></div>`).join(""):"<p>No missed questions.</p>"}<button class="primary" style="width:100%" onclick="reset()">Restart</button></div>`}
function render(){if(!S.started)return renderStart();if(S.submitted)return renderResults();return renderQuestion()}render();
</script></body></html>

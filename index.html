<!doctype html>
<html>
<head>

<title>Local 39 Full Testing Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f7;color:#111827;font-size:17px}
#app{max-width:850px;margin:0 auto;padding:14px 14px 40px}
.card{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
h1{font-size:28px;text-align:center;margin:8px 0 6px}h2{font-size:22px;margin:14px 0 10px}
p{line-height:1.4}.muted{color:#64748b;font-size:15px}.center{text-align:center}
button{font:inherit;width:100%;border:0;border-radius:18px;padding:16px;margin:7px 0;background:white}
.primary{background:#2563eb;color:white;font-weight:800}.green{background:#16a34a;color:white;font-weight:800}.light{border:1px solid #cbd5e1}
.option{border:2px solid #cbd5e1;text-align:left}.option.active{border-color:#2563eb;background:#eff6ff}
.choice{border:2px solid #cbd5e1;text-align:left;display:flex;gap:10px;align-items:flex-start;line-height:1.25}
.choice.sel{border-color:#2563eb;background:#eff6ff}.choice.good{border-color:#16a34a;background:#f0fdf4}.choice.bad{border-color:#dc2626;background:#fef2f2}
.timerrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.pill{background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;padding:10px;text-align:center;font-size:15px}
.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#2563eb}
.q{font-size:21px;font-weight:800;line-height:1.32;margin:18px 0}.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin:12px 0}
.explain{background:#fef9c3;border:1px solid #fde68a;border-radius:16px;padding:13px;margin:12px 0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/3}
.passage{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin:14px 0}.result{border:1px solid #cbd5e1;border-radius:16px;padding:12px;margin:10px 0;background:white}.miss{background:#fffbeb;border-color:#fde68a}
svg{width:100%;max-width:610px;display:block;margin:14px auto;border:1px solid #e2e8f0;border-radius:16px;background:white}
.tag{display:inline-block;background:#e0f2fe;color:#075985;border-radius:999px;padding:3px 9px;font-size:13px;margin-top:5px}
@media(max-width:380px){body{font-size:16px}.q{font-size:19px}h1{font-size:25px}.timerrow{grid-template-columns:1fr}}
</style>

<script>
function gcd(a,b){while(b){var t=b;b=a%b;a=t}return Math.abs(a)}
function shuffle(a){var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t;} return b}
function choicePack(correct, wrongs){var vals=[correct].concat(wrongs).map(String); vals=[...new Set(vals)]; while(vals.length<4){vals.push(String(Number(correct)+vals.length+1))} vals=vals.slice(0,4); vals=shuffle(vals); return {c:vals,a:vals.indexOf(String(correct))}}
function money(n){return "$"+Number(n).toFixed(2).replace(".00","")}
function add(Q,b,t,q,c,a,e,m,d,p){Q.push({b:b,t:t,q:q,c:c,a:a,e:e,m:m,d:d,p:p})}
function makeAllQuestions(){
var Q=[];

// Bucket 1: 100 unique math questions
for(var i=0;i<20;i++){var a=23+i*3,b=12+(i%9)*4,ans=a*b,pk=choicePack(ans,[ans-20,ans+20,ans+40]);add(Q,"Bucket 1 - Math","Multiplication","Multiply: "+a+" × "+b,pk.c,pk.a,a+" × "+b+" = "+ans+".","Line up the numbers and multiply one digit at a time.")}
for(var i=0;i<10;i++){var a=(3.2+i/2).toFixed(1),b=(1.5+(i%5)*0.5).toFixed(1),ans=(a*b).toFixed(1),pk=choicePack(ans,[(a*b+0.5).toFixed(1),(a*b-0.5).toFixed(1),(a*b+1).toFixed(1)]);add(Q,"Bucket 1 - Math","Decimal Multiplication","Multiply: "+a+" × "+b,pk.c,pk.a,"Multiply first, then place the decimal. Answer: "+ans+".","Count decimal places after multiplying.")}
for(var i=0;i<15;i++){var den=5+(i%7), whole=3+(i%6), rem=1+(i%(den-1)), top=whole*den+rem, correct=whole+" "+rem+"/"+den, pk=choicePack(correct,[(whole+1)+" "+rem+"/"+den,whole+" "+(rem+1)+"/"+den,(whole-1)+" "+rem+"/"+den]);add(Q,"Bucket 1 - Math","Improper Fractions","Simplify the improper fraction: "+top+"/"+den,pk.c,pk.a,top+" ÷ "+den+" = "+whole+" remainder "+rem+", so the answer is "+correct+".","Divide top by bottom. Remainder becomes the new numerator.")}
for(var i=0;i<10;i++){var d1=[3,4,5,6,8,10][i%6],d2=[4,5,6,8,10,12][(i+2)%6],n1=1+(i%(d1-1)),n2=1+((i+2)%(d2-1)),l=d1*d2/gcd(d1,d2),num=n1*(l/d1)+n2*(l/d2),w=Math.floor(num/l),r=num%l,gg=gcd(r,l);r/=gg;var dd=l/gg;var correct=w? w+" "+r+"/"+dd : r+"/"+dd; if(r===0) correct=String(w); var pk=choicePack(correct,[w+" "+(r+1)+"/"+dd,(w+1)+" "+r+"/"+dd,r+"/"+l]);add(Q,"Bucket 1 - Math","Adding Fractions","Add the fractions: "+n1+"/"+d1+" + "+n2+"/"+d2,pk.c,pk.a,"Use a common denominator. The answer is "+correct+".","Find a common denominator before adding fractions.")}
for(var i=0;i<15;i++){var cost=50+i*15, pct=[5,8,10,12,15,20,25,30][i%8],isTax=i%2===0,change=cost*pct/100,ans=isTax?cost+change:cost-change,pk=choicePack(money(ans),[money(ans+5),money(ans-5),money(change)]);add(Q,"Bucket 1 - Math",isTax?"Sales Tax":"Discount",(isTax?"A supply order":"A tool")+" costs "+money(cost)+". "+(isTax?"Sales tax is ":"It is ")+pct+"%"+(isTax?". What is the total cost including tax?":" off. What is the sale price?"),pk.c,pk.a,pct+"% of "+money(cost)+" is "+money(change)+". "+(isTax?"Tax means add. ":"Discount means subtract. ")+"Answer: "+money(ans)+".",isTax?"Tax = add.":"Discount = subtract.")}
for(var i=0;i<10;i++){var pct=[10,15,20,25,30,40,50,60,75,80][i],whole=120+i*30,part=whole*pct/100,pk=choicePack(whole,[whole-20,whole+20,whole+40]);add(Q,"Bucket 1 - Math","Percent of What Number",pct+"% of what number is "+part+"?",pk.c,pk.a,part+" ÷ "+(pct/100)+" = "+whole+".","Percent of what number = divide by the decimal percent.")}
for(var i=0;i<10;i++){var tank=120+i*30,pct=[10,20,25,30,40,50,60,75,80,90][i],remain=tank-(tank*pct/100),pk=choicePack(remain,[tank*pct/100,tank,remain+10]);add(Q,"Bucket 1 - Math","Tank Remaining","A tank holds "+tank+" gallons. If "+pct+"% is drained, how many gallons remain?",pk.c,pk.a,pct+"% is drained, so "+(100-pct)+"% remains. Answer: "+remain+" gallons.","Drained means find what is left.")}
for(var i=0;i<10;i++){if(i%2===0){var units=4+i,wt=12+i*2,ans=units*wt,pk=choicePack(ans,[ans-10,ans+8,ans+16]);add(Q,"Bucket 1 - Math","Applied Word Problems","A technician installs "+units+" units that each weigh "+wt+" lb. What is the total weight?",pk.c,pk.a,units+" × "+wt+" = "+ans+" lb.","Total means multiply number of items by each amount.")}else{var miles=90+i*20,hrs=2+(i%4),ans=miles/hrs,pk=choicePack(ans,[ans-5,ans+5,ans+10]);add(Q,"Bucket 1 - Math","Average Speed","A technician drives "+miles+" miles in "+hrs+" hours. What was the average speed?",pk.c,pk.a,miles+" ÷ "+hrs+" = "+ans+" mph.","Average speed = miles divided by hours.")}}

// Bucket 2: 100 measurement/geometry questions
for(var i=0;i<20;i++){var kind=i%4;if(kind===0){var cm=2+i,ans=cm*10,pk=choicePack(ans,[ans/10,ans+10,ans*10]);add(Q,"Bucket 2 - Measurement / Geometry","Metric Conversion",cm+" centimeters = how many millimeters?",pk.c,pk.a,cm+" cm = "+ans+" mm.","cm to mm: move decimal 1 place right.")}if(kind===1){var mm=50+i*10,ans=mm/10,pk=choicePack(ans,[ans*10,ans+10,ans-1]);add(Q,"Bucket 2 - Measurement / Geometry","Metric Conversion",mm+" millimeters = how many centimeters?",pk.c,pk.a,mm+" mm = "+ans+" cm.","mm to cm: move decimal 1 place left.")}if(kind===2){var m=1+i,ans=m*100,pk=choicePack(ans,[ans/10,ans*10,ans+10]);add(Q,"Bucket 2 - Measurement / Geometry","Metric Conversion",m+" meters = how many centimeters?",pk.c,pk.a,m+" m = "+ans+" cm.","m to cm: move decimal 2 places right.")}if(kind===3){var L=1+i/2,ans=L*1000,pk=choicePack(ans,[ans/10,ans/100,ans+100]);add(Q,"Bucket 2 - Measurement / Geometry","Liters / Milliliters",L+" liters = how many milliliters?",pk.c,pk.a,L+" L = "+ans+" mL.","Liters to milliliters: move decimal 3 places right.")}}
for(var i=0;i<15;i++){var kind=i%5;if(kind===0){var ft=2+i,ans=ft*12,pk=choicePack(ans,[ans/2,ans+12,ans-12]);add(Q,"Bucket 2 - Measurement / Geometry","U.S. Conversion",ft+" feet = how many inches?",pk.c,pk.a,"1 foot = 12 inches. "+ft+" × 12 = "+ans+".","Feet to inches: multiply by 12.")}if(kind===1){var yd=1+i,ans=yd*3,pk=choicePack(ans,[ans*12,ans+3,yd]);add(Q,"Bucket 2 - Measurement / Geometry","U.S. Conversion",yd+" yards = how many feet?",pk.c,pk.a,"1 yard = 3 feet. "+yd+" × 3 = "+ans+".","Yards to feet: multiply by 3.")}if(kind===2){var gal=1+i,ans=gal*4,pk=choicePack(ans,[ans*2,gal,ans+4]);add(Q,"Bucket 2 - Measurement / Geometry","Volume Conversion",gal+" gallons = how many quarts?",pk.c,pk.a,"1 gallon = 4 quarts. Answer: "+ans+".","Gallons to quarts: multiply by 4.")}if(kind===3){var lb=1+i,ans=lb*16,pk=choicePack(ans,[ans/2,ans+16,lb]);add(Q,"Bucket 2 - Measurement / Geometry","Weight Conversion",lb+" pounds = how many ounces?",pk.c,pk.a,"1 pound = 16 ounces. Answer: "+ans+".","Pounds to ounces: multiply by 16.")}if(kind===4){var tons=1+i%3,ans=tons*2000,pk=choicePack(ans,[ans/2,ans+500,ans-500]);add(Q,"Bucket 2 - Measurement / Geometry","Weight Conversion",tons+" ton(s) = how many pounds?",pk.c,pk.a,"1 ton = 2,000 pounds. Answer: "+ans+".","Ton = 2,000 pounds.")}}
for(var i=0;i<15;i++){var a1=30+i*3,a2=40+(i%5)*10,miss=180-a1-a2,pk=choicePack(miss,[miss+10,miss-10,180-miss]);add(Q,"Bucket 2 - Measurement / Geometry","Triangle Angles","A triangle has angles of "+a1+"° and "+a2+"°. What is the missing angle?",pk.c,pk.a,"Triangle angles total 180°. 180 - "+a1+" - "+a2+" = "+miss+"°.","Triangle = 180° total.")}
var shapes=[["triangle",3],["quadrilateral",4],["pentagon",5],["hexagon",6],["heptagon",7],["octagon",8],["nonagon",9],["decagon",10]];
for(var i=0;i<15;i++){var sh=shapes[i%shapes.length],pk=choicePack(sh[0],[shapes[(i+1)%shapes.length][0],shapes[(i+2)%shapes.length][0],shapes[(i+3)%shapes.length][0]]);add(Q,"Bucket 2 - Measurement / Geometry","2D Shapes","A polygon has "+sh[1]+" sides. What is it called?",pk.c,pk.a,"A "+sh[0]+" has "+sh[1]+" sides.","Memorize common polygon side counts.")}
for(var i=0;i<15;i++){var l=8+i,w=5+(i%6),ans=l*w,pk=choicePack(ans,[ans+l,ans-w,2*l+2*w]);add(Q,"Bucket 2 - Measurement / Geometry","Area","A rectangular floor is "+l+" ft long and "+w+" ft wide. What is the area?",pk.c,pk.a,"Area = length × width = "+l+" × "+w+" = "+ans+" sq ft.","Area of rectangle = length × width.")}
for(var i=0;i<10;i++){var l=3+i,w=4+(i%4),h=5+(i%5),ans=l*w*h,pk=choicePack(ans,[l*w+h,ans+l,ans-h]);add(Q,"Bucket 2 - Measurement / Geometry","Volume","A box is "+l+" ft by "+w+" ft by "+h+" ft. What is the volume?",pk.c,pk.a,"Volume = length × width × height = "+ans+" cubic feet.","Volume of a box = L × W × H.")}
for(var i=0;i<10;i++){var vals=[12+i,18+i*2,24+i*2,30+i*3],range=Math.max.apply(null,vals)-Math.min.apply(null,vals),pk=choicePack(range,[range+2,range-2,vals[2]]);add(Q,"Bucket 2 - Measurement / Geometry","Graphs / Range","A chart shows these values: "+vals.join(", ")+". What is the range?",pk.c,pk.a,"Range = highest - lowest = "+Math.max.apply(null,vals)+" - "+Math.min.apply(null,vals)+" = "+range+".","Range = biggest number minus smallest number.")}

// Bucket 3: 100 mechanical
var gearQs=[["Two gears touch. If Gear A turns clockwise, Gear B turns:",["Clockwise","Counterclockwise","It stops","Not enough info"],1,"Touching gears rotate opposite directions.","Touching gears = opposite."],["Three gears are in a row. If the first turns clockwise, the third turns:",["Clockwise","Counterclockwise","It stops","Not enough info"],0,"The direction reverses twice, so third matches first.","Odd number of gears = same direction."],["Four gears are in a row. If the first turns clockwise, the fourth turns:",["Clockwise","Counterclockwise","It stops","Not enough info"],1,"Each touch reverses direction. Four gears means first and last are opposite.","Even number of gears = opposite direction."]];
for(var i=0;i<20;i++){var g=gearQs[i%3];add(Q,"Bucket 3 - Mechanical Aptitude","Gears",g[0],g[1],g[2],g[3],g[4],i%5===0?"gears":null)}
for(var i=0;i<15;i++){add(Q,"Bucket 3 - Mechanical Aptitude","Leverage / Torque",(i%2?"A bolt is stuck. Which tool usually gives more turning force?":"If more leverage and torque are needed, which tool is better?"),["6-inch wrench","12-inch wrench","No difference","Shorter handle"],1,"The 12-inch wrench is longer, so it gives more leverage.","Longer handle = more torque.",i%4===0?"wrench":null)}
for(var i=0;i<15;i++){var isRev=i%2;add(Q,"Bucket 3 - Mechanical Aptitude","Threads / Tools",isRev?"A bolt is reverse threaded. Which way usually loosens it?":"A normal bolt usually loosens by turning which way?",["Clockwise","Counterclockwise","Upward","Either direction always"],isRev?0:1,isRev?"Reverse thread loosens clockwise.":"Normal thread usually loosens counterclockwise.","Normal = lefty loosey. Reverse = opposite.")}
for(var i=0;i<15;i++){var fixed=i%2===0;add(Q,"Bucket 3 - Mechanical Aptitude","Pulleys",fixed?"A fixed pulley mainly helps by:":"Adding more rope sections supporting a load usually means:",fixed?["Changing direction of force","Doubling the weight","Removing all friction","Measuring distance"]:["More effort is needed","Less effort is needed","The load disappears","The rope gets shorter"],fixed?0:1,fixed?"A fixed pulley changes the pull direction.":"More supporting rope sections reduce effort.","Fixed = direction. More support = less effort.")}
var tools=[["socket wrench","turning nuts and bolts"],["Allen wrench","hex-socket screws"],["torque wrench","tightening to a specific torque"],["pliers","gripping and holding"],["hammer","striking objects"],["screwdriver","turning screws"]];
for(var i=0;i<15;i++){var tool=tools[i%tools.length],pk=choicePack(tool[1],["measuring yards","checking water level","reading voltage"]);add(Q,"Bucket 3 - Mechanical Aptitude","Tool Selection","A "+tool[0]+" is mainly used for:",pk.c,pk.a,"A "+tool[0]+" is used for "+tool[1]+".","Match the tool to its normal job.")}
for(var i=0;i<20;i++){var frac=[["1/4","0.25"],["1/8","0.125"],["3/8","0.375"],["1/2","0.5"],["5/8","0.625"],["3/4","0.75"],["7/8","0.875"],["1/16","0.0625"]][i%8],pk=choicePack(frac[1],["0.25","0.5","0.75","0.125"].filter(x=>x!==frac[1]));add(Q,"Bucket 3 - Mechanical Aptitude","Ruler / Tape Measure","On a ruler, "+frac[0]+" inch equals which decimal?",pk.c,pk.a,frac[0]+" inch = "+frac[1]+".","Memorize common ruler decimals.",i%7===0?"ruler":null)}

// Bucket 4: 100 English
var combine=[["The worker checked the gauge. The worker recorded the reading.","The worker checked the gauge, then recorded the reading."],["The crew arrived early. They wanted to finish before noon.","The crew arrived early because they wanted to finish before noon."],["The filter was clogged. The machine began to overheat.","The filter was clogged, so the machine began to overheat."],["The valve was stuck. The worker used a longer wrench.","The valve was stuck, so the worker used a longer wrench."]];
for(var i=0;i<20;i++){var x=combine[i%combine.length],pk=choicePack(x[1],[x[1].replace(", then"," but"),x[1].replace("because","or"),x[1].replace(", so",",")]);add(Q,"Bucket 4 - English","Sentence Combining","Choose the best way to combine: "+x[0],pk.c,pk.a,"The best answer combines the ideas clearly and logically.","Choose the sentence that sounds clear and keeps the meaning.")}
var punct=[["After the inspection was complete","the supervisor signed the report"],["Before the machine was restarted","the technician checked the guards"],["When the alarm sounded","the operator checked the control panel"],["Because the floor was wet","the area was marked with cones"],["Although the repair was delayed","the crew finished safely"]];
for(var i=0;i<20;i++){var x=punct[i%punct.length],correct=x[0]+", "+x[1]+".",pk=choicePack(correct,[x[0]+" "+x[1]+".",x[0].replace(" "," , ")+" "+x[1]+".",x[0]+" "+x[1].replace(" "," , ")+"."]);add(Q,"Bucket 4 - English","Punctuation","Choose the correctly punctuated sentence.",pk.c,pk.a,"Use a comma after the opening phrase: "+correct,"Opening phrase first? Add a comma.")}
var run=[["The pump was leaking","the operator shut off the valve"],["The alarm sounded","the maintenance team responded immediately"],["The floor was wet","cones were placed around the area"],["The motor hummed","it did not start"],["The work order was unclear","the supervisor explained the task"]];
for(var i=0;i<20;i++){var x=run[i%run.length],correct=x[0]+". "+x[1][0].toUpperCase()+x[1].slice(1)+".",pk=choicePack(correct,[x[0]+" "+x[1]+".",x[0]+". "+x[1]+".",x[0]+", "+x[1]+"."]);add(Q,"Bucket 4 - English","Run-On Sentences","Choose the best correction: "+x[0]+" "+x[1]+".",pk.c,pk.a,"Split the two complete thoughts into two sentences.","Run-on = two complete thoughts smashed together.")}
var off=[["The technician inspected the motor.","The technician checked the wiring.","The technician measured the voltage.","The technician went grocery shopping."],["The worker put on safety glasses.","The worker checked the machine guard.","The worker began grinding metal.","The worker watched a movie."],["The crew shut off the water supply.","The crew drained the pipe.","The crew replaced the valve.","The crew baked cookies."]];
for(var i=0;i<15;i++){var c=off[i%off.length];add(Q,"Bucket 4 - English","Does Not Belong","Which sentence does not belong with the others?",c,3,"The last sentence changes the topic.","Find the sentence that does not match the topic.")}
var passages=[
["Safety Inspection","Before beginning maintenance on a machine, workers should make sure the equipment cannot start unexpectedly. One common step is to turn off the power and follow lockout procedures. These procedures help prevent injuries by keeping energy sources under control while repairs are being made.","What is the main idea of the passage?",["Lockout procedures help make maintenance safer.","Workers should use fewer tools.","Machines should run during repairs.","Repairs should be rushed."],0],
["Water Use","A facility began tracking water use after noticing higher utility bills. The maintenance staff checked restrooms, cooling equipment, and irrigation lines for leaks. They found that one outdoor valve had been left partly open. After the valve was repaired, water use dropped.","Why did the facility begin tracking water use?",["Utility bills had increased.","The building was closed.","The pipes were painted.","The staff wanted uniforms."],0],
["Equipment Log","Each time a generator is tested, the operator records the date, run time, voltage, and any unusual conditions. A clear log helps the next worker understand what has already been checked.","Why is a clear log useful?",["It shows what has already been checked.","It replaces all tools.","It makes machines hotter.","It removes the need for workers."],0],
["Air Filters","Air filters help keep dust and debris from entering ventilation equipment. When a filter becomes clogged, airflow may decrease and the unit may have to work harder.","What may happen when a filter becomes clogged?",["Airflow may decrease.","The unit becomes lighter.","The filter cleans itself.","The fan stops all motion forever."],0],
["Work Orders","A work order gives workers information about a task that needs to be completed. It may list the equipment number, location, problem description, and priority level.","What does a work order provide?",["Information about a task.","A lunch schedule.","Vacation plans.","A weather report."],0]
];
for(var i=0;i<25;i++){var p=passages[i%passages.length];add(Q,"Bucket 4 - English","Reading Comprehension",p[2],p[3],p[4],"Answer from the passage. "+p[3][p[4]]+" is supported by the text.","For reading questions, answer from the passage, not opinion.",null,p[0]+": "+p[1])}

return Q;
}
var ALL=makeAllQuestions();
var OPTIONS=[
{id:"bucket1",label:"Bucket 1 - Math",count:100,filter:function(q){return q.b.indexOf("Bucket 1")===0}},
{id:"bucket2",label:"Bucket 2 - Measurement / Geometry",count:100,filter:function(q){return q.b.indexOf("Bucket 2")===0}},
{id:"bucket3",label:"Bucket 3 - Mechanical Aptitude",count:100,filter:function(q){return q.b.indexOf("Bucket 3")===0}},
{id:"bucket4",label:"Bucket 4 - English",count:100,filter:function(q){return q.b.indexOf("Bucket 4")===0}},
{id:"final",label:"Final Exam - All Buckets",count:125,filter:function(q){return true}}
];
var S={mode:"practice",type:"final",started:false,submitted:false,current:0,selected:{},times:{},seed:1,start:0,qstart:0};
var T=[], timer=null, app=document.getElementById("app");
function build(){var o=OPTIONS.filter(function(x){return x.id===S.type})[0]||OPTIONS[4]; var pool=ALL.filter(o.filter); var base=shuffle(pool); return base.slice(0,o.count).map(function(x,i){return Object.assign({},x,{inst:i})})}
function fmt(ms){var t=Math.max(0,Math.floor(ms/1000)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function ans(i){return i===undefined?"Blank":String.fromCharCode(65+i)}
function flush(){if(!S.started||S.submitted)return; var e=Date.now()-S.qstart; S.times[S.current]=(S.times[S.current]||0)+e; S.qstart=Date.now()}
function startTest(){T=build();S.started=true;S.submitted=false;S.current=0;S.selected={};S.times={};S.start=Date.now();S.qstart=S.start;clearInterval(timer);timer=setInterval(render,1000);render()}
function reset(){clearInterval(timer);S.started=false;S.submitted=false;S.current=0;S.selected={};S.times={};S.seed++;render()}
function choose(i){S.selected[S.current]=i;render()}
function go(i){flush();S.current=Math.max(0,Math.min(i,T.length-1));render()}
function submit(){flush();S.submitted=true;clearInterval(timer);render()}
function gear(cx,cy,r,label){var pts=[];for(var i=0;i<24;i++){var a=Math.PI*2*i/24,rr=i%2?r-7:r;pts.push((cx+rr*Math.cos(a))+","+(cy+rr*Math.sin(a)))}return '<g><polygon points="'+pts.join(" ")+'" fill="none" stroke="black" stroke-width="2"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.32)+'" fill="none" stroke="black" stroke-width="2"/><text x="'+(cx-27)+'" y="'+(cy+r+22)+'" font-size="13">'+label+'</text></g>'}
function diagram(d){if(d==="gears")return '<svg viewBox="0 0 420 170"><text x="140" y="24" font-size="16" font-weight="700">Middle gear clockwise</text>'+gear(105,100,34,"Outside")+gear(210,82,46,"Middle")+gear(315,100,34,"Outside")+'<path d="M180 38 C215 10,262 28,264 68" fill="none" stroke="black" stroke-width="3"/><polygon points="264,68 255,54 276,57" fill="black"/></svg>';if(d==="wrench")return '<svg viewBox="0 0 430 160"><text x="78" y="38" font-size="16" font-weight="700">Tool #1</text><rect x="45" y="70" width="115" height="16" rx="8" fill="#d9d9d9" stroke="black"/><circle cx="42" cy="78" r="13" fill="none" stroke="black" stroke-width="3"/><circle cx="164" cy="78" r="13" fill="none" stroke="black" stroke-width="3"/><text x="86" y="120" font-size="16">6&quot;</text><text x="270" y="38" font-size="16" font-weight="700">Tool #2</text><rect x="220" y="70" width="165" height="16" rx="8" fill="#d9d9d9" stroke="black"/><circle cx="217" cy="78" r="13" fill="none" stroke="black" stroke-width="3"/><circle cx="389" cy="78" r="13" fill="none" stroke="black" stroke-width="3"/><text x="296" y="120" font-size="16">12&quot;</text></svg>';if(d==="ruler"){var ticks="";for(var i=0;i<33;i++){var x=40+360/32*i,len=i%16===0?36:i%8===0?28:i%4===0?22:i%2===0?16:10;ticks+='<line x1="'+x+'" y1="45" x2="'+x+'" y2="'+(45+len)+'" stroke="black"/>'}return '<svg viewBox="0 0 460 145"><rect x="40" y="45" width="360" height="50" fill="#f2d36b" stroke="black"/>'+ticks+'<text x="218" y="122" font-size="20">1</text><text x="395" y="122" font-size="20">2</text><line x1="287.5" y1="18" x2="287.5" y2="45" stroke="red" stroke-width="3"/><polygon points="287.5,45 279,32 296,32" fill="red"/><text x="270" y="16" fill="red" font-size="16" font-weight="700">???</text></svg>'}return ""}
function renderStart(){app.innerHTML='<div class="card"><h1>Local 39 Testing Simulator</h1><p class="center muted">Full question bank: 100 per bucket, 125-question final exam</p><div class="grid grid2"><button class="option '+(S.mode==="practice"?"active":"")+'" onclick="S.mode=\\'practice\\';render()"><b>Practice Mode</b><br><span class="muted">Explanations after each answer.</span></button><button class="option '+(S.mode==="test"?"active":"")+'" onclick="S.mode=\\'test\\';render()"><b>Test Mode</b><br><span class="muted">No explanations until submit.</span></button></div><h2>Choose test type</h2><div class="grid">'+OPTIONS.map(function(o){return '<button class="option '+(S.type===o.id?"active":"")+'" onclick="S.type=\\''+o.id+'\\';render()"><b>'+o.label+'</b><br><span class="muted">'+o.count+' questions</span></button>'}).join("")+'</div><div class="note"><b>Included:</b> total timer, per-question timer, average time, score by bucket, and missed-question study list.</div><button class="btn primary" onclick="startTest()">Start Test</button></div>'}
function renderQuestion(){var q=T[S.current],answered=Object.keys(S.selected).length,total=Date.now()-S.start,curr=(S.times[S.current]||0)+(Date.now()-S.qstart),show=S.mode==="practice"&&S.selected[S.current]!==undefined;app.innerHTML='<div class="card"><div class="topbar"><div><div class="muted">'+q.b+' • '+q.t+'</div><h2>Question '+(S.current+1)+' of '+T.length+'</h2></div></div><div class="timerrow"><div class="pill">Total<br><b>'+fmt(total)+'</b></div><div class="pill">This Q<br><b>'+fmt(curr)+'</b></div></div><div class="progress"><div class="bar" style="width:'+((S.current+1)/T.length*100)+'%"></div></div><div class="muted">Answered: '+answered+'/'+T.length+'</div>'+(q.p?'<div class="passage"><b>Passage:</b> '+q.p+'</div>':"")+diagram(q.d)+'<div class="q">'+q.q+'</div>'+q.c.map(function(c,i){var sel=S.selected[S.current]===i,cls="choice";if(show&&i===q.a)cls+=" good";else if(show&&sel&&i!==q.a)cls+=" bad";else if(sel)cls+=" sel";return '<button class="'+cls+'" onclick="choose('+i+')"><b>'+String.fromCharCode(65+i)+'.</b><span>'+c+'</span></button>'}).join("")+(show?'<div class="explain"><b>Explanation</b><br>'+q.e+'<br><br><b>Memory tip:</b> '+q.m+'</div>':"")+'<div class="nav"><button class="btn light" '+(S.current===0?"disabled":"")+' onclick="go('+(S.current-1)+')">Previous</button>'+(S.current<T.length-1?'<button class="btn primary" onclick="go('+(S.current+1)+')">Next</button>':'<button class="btn green" onclick="submit()">Submit</button>')+'</div></div>'}
function renderResults(){var total=Object.values(S.times).reduce(function(a,b){return a+b},0),score=T.reduce(function(s,q,i){return s+(S.selected[i]===q.a?1:0)},0),missed=T.map(function(q,i){return Object.assign({},q,{index:i,sel:S.selected[i],tm:S.times[i]||0})}).filter(function(x){return x.sel!==x.a}),buckets={};T.forEach(function(q,i){if(!buckets[q.b])buckets[q.b]={t:0,c:0};buckets[q.b].t++;if(S.selected[i]===q.a)buckets[q.b].c++});app.innerHTML='<div class="card"><h1>Test Complete</h1><p class="center" style="font-size:22px">Score: <b>'+score+'/'+T.length+'</b> ('+Math.round(score/T.length*100)+'%)</p><div class="grid grid3"><div class="pill">Total<br><b>'+fmt(total)+'</b></div><div class="pill">Avg / Q<br><b>'+fmt(total/T.length)+'</b></div><div class="pill">Missed<br><b>'+missed.length+'</b></div></div><h2>Score by bucket</h2><div class="grid grid2">'+Object.keys(buckets).map(function(b){var s=buckets[b];return '<div class="pill"><b>'+b+'</b><br>'+s.c+'/'+s.t+' correct ('+Math.round(s.c/s.t*100)+'%)</div>'}).join("")+'</div><h2>Missed-question study list</h2><div class="note">Use this list to create a weak-area test later. Also review questions that took too long.</div>'+(missed.slice(0,40).map(function(x){return '<div class="result miss"><b>Q'+(x.index+1)+': '+x.t+'</b><br>Your answer: '+ans(x.sel)+' | Correct: '+ans(x.a)+' | Time: '+fmt(x.tm)+'<br><span class="muted">Memory tip: '+x.m+'</span></div>'}).join("")||"<p>No missed questions. Great job.</p>")+'<button class="btn primary" onclick="reset()">Restart with shuffled questions</button></div>'}
function render(){if(!S.started)return renderStart();if(S.submitted)return renderResults();return renderQuestion()}render();
</script>
</body></html>
